[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrun"
version = "0.1.0"
description = "Run ordinary project code on cloud compute, with reproducible uploads and selective file sync."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aliaksei Kaliutau"}]
keywords = ["modal", "cloud", "gpu", "remote-execution", "synchronization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pathspec>=0.12.1,<2"]

[project.urls]
Homepage = "https://github.com/akaliutau/skyrun"
Documentation = "https://github.com/akaliutau/skyrun/tree/HEAD/docs"
Repository = "https://github.com/akaliutau/skyrun"
Issues = "https://github.com/akaliutau/skyrun/issues"
Changelog = "https://github.com/akaliutau/skyrun/blob/HEAD/CHANGELOG.md"

[project.optional-dependencies]
modal = ["modal>=1.3.1,<1.4"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
skyrun = "skyrun.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
include = ["skyrun*"]

[tool.setuptools.package-data]
skyrun = ["py.typed", "default.modalignore", "examples/*/*.toml", "examples/*/*.txt", "examples/*/.modalignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicit opt-in and a Modal account (may incur compute charges)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # The formatter wraps code; keep long messages and example strings readable.

[tool.ruff.lint.per-file-ignores]
"tests/test_modal.py" = ["E402"]  # Optional SDK imports follow pytest.importorskip.
"tests/test_remote_transport.py" = ["E402"]

[tool.coverage.run]
source = ["skyrun"]
branch = true
omit = ["src/skyrun/examples/*"]

[tool.coverage.report]
show_missing = true


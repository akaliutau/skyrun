name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        modal-version: ['1.3.*']
        include:
          - python-version: '3.12'
            modal-version: '1.3.1'
          - python-version: '3.12'
            modal-version: '1.3.2'
          - python-version: '3.12'
            modal-version: '1.3.3'
          - python-version: '3.12'
            modal-version: '1.3.4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[modal,dev]' 'modal==${{ matrix.modal-version }}'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

